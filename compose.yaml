# `docker compose up` from the repo root: the DeRec reference app on SQLite, at
# http://localhost:5000, from the published image. Add `-f compose.build.yaml`
# to build the image from your checkout instead.
#
# The service lives in examples/compose.sqlite.yaml, documented inline; the
# PostgreSQL variant is compose.postgres.yaml. ./start.sh runs either, picks
# free ports, and waits until the node is healthy.

name: derec

include:
  - examples/compose.sqlite.yaml
