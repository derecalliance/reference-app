<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DeRec</title>
    <script>
      // GitHub Pages SPA redirect: rewrites the path into a query string so
      // index.html can restore it on load. Only applies to /reference-app/session/* paths.
      var repo = '/reference-app';
      var path = window.location.pathname;
      if (path.indexOf(repo + '/session/') === 0) {
        var sessionPath = path.slice(repo.length);
        window.location.replace(
          repo + '/?p=' + encodeURIComponent(sessionPath)
        );
      }
    </script>
  </head>
  <body></body>
</html>
